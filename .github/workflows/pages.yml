# main에 push하면 React 앱 화면을 빌드해 GitHub Pages에 배포합니다.
# GitHub Pages에는 서버(server.ts)가 없어서, 채팅은 브라우저에서 문장 속 낱말로 감정을 읽어요(src/data/localAnalysis.ts).
# AI(Gemini) 답변이 나오는 전체 앱은 AI Studio → Cloud Run 배포(https://maeumgyeol.ai.studio)를 사용합니다.
name: GitHub Pages 배포

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 사이트 주소가 /저장소이름/ 아래라서 base를 맞춰 줘요
      - name: React 화면 빌드
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
